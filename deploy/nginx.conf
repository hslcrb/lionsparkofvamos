# Static-only host for the exported site (no live cheer sharing).
#
#   npm run build
#   sudo cp -r out /var/www/lionspark
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/lionspark
#   sudo ln -s /etc/nginx/sites-available/lionspark /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# /main still works, but without /api/room the page shows no live crowd count.
# Use the Node server (server/standalone.mjs) or the Cloudflare Worker when the
# shared cheer room matters.

server {
    listen 80;
    server_name _;
    root /var/www/lionspark;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary application/wasm;

    location = /healthz {
        default_type application/json;
        return 200 '{"ok":true}';
    }

    location ~* \.(?:js|css|png|jpg|webp|mp3|glb|wasm|woff2)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /418 { try_files /418.html =404; }
    location = /main { try_files /main.html =404; }
    location = /lionspark { try_files /lionspark.html =404; }
    location = / { try_files /index.html =404; }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html /404.html =404;
    }
}
